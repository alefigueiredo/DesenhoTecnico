<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="100%" height="240" style="background:#0f172a; border-radius:12px; font-family:sans-serif;">
    <style>
        .title { fill: #f8fafc; font-size: 16px; font-weight: bold; }
        .label { fill: #94a3b8; font-size: 13px; }
        .highlight { fill: #38bdf8; font-size: 14px; font-weight: bold; }
        .line-axis { stroke: #e2e8f0; stroke-width: 1.5; stroke-dasharray: 6 4; }
        .line-main { stroke: #38bdf8; stroke-width: 2.5; fill: none; }
        .symbol-fill { fill: #38bdf8; fill-opacity: 0.15; stroke: #38bdf8; stroke-width: 2; }
    </style>

    <!-- Símbolo ABNT 1º Diedro -->
    <g transform="translate(40, 30)">
        <text x="0" y="20" class="title">Símbolo ABNT — Primeiro Diedro (Brasil / ISO)</text>
        <line x1="20" y1="120" x2="220" y2="120" class="line-axis"/>
        <line x1="120" y1="50" x2="120" y2="190" class="line-axis"/>
        
        <!-- Tronco de cone -->
        <polygon points="50,90 100,75 100,165 50,150" class="symbol-fill"/>
        
        <!-- Círculos da projeção -->
        <circle cx="170" cy="120" r="45" class="symbol-fill"/>
        <circle cx="170" cy="120" r="22.5" class="symbol-fill"/>
    </g>

    <!-- Divisória -->
    <line x1="300" y1="30" x2="300" y2="210" stroke="#334155" stroke-width="2"/>

    <!-- Posição dos Planos -->
    <g transform="translate(330, 30)">
        <text x="0" y="20" class="title">Posicionamento das Vistas (1º Diedro)</text>
        <rect x="10" y="50" width="75" height="55" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
        <text x="47" y="82" text-anchor="middle" class="highlight">Frontal</text>
        
        <rect x="95" y="50" width="75" height="55" rx="6" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
        <text x="132" y="75" text-anchor="middle" class="label">Lat. Esq.</text>
        <text x="132" y="90" text-anchor="middle" opacity="0.6" class="label">(À direita)</text>

        <rect x="10" y="115" width="75" height="55" rx="6" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
        <text x="47" y="140" text-anchor="middle" class="label">Superior</text>
        <text x="47" y="155" text-anchor="middle" opacity="0.6" class="label">(Abaixo)</text>
    </g>
</svg>
