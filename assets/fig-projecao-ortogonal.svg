<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="100%" height="280" style="background:#0f172a; border-radius:12px; font-family:sans-serif;">
    <style>
        .title { fill: #f8fafc; font-size: 16px; font-weight: bold; }
        .label { fill: #94a3b8; font-size: 12px; }
        .view-title { fill: #38bdf8; font-size: 13px; font-weight: bold; }
        .box { fill: #1e293b; stroke: #38bdf8; stroke-width: 2; }
        .line-hidden { stroke: #f59e0b; stroke-width: 1.5; stroke-dasharray: 4 3; }
        .line-center { stroke: #4ade80; stroke-width: 1.5; stroke-dasharray: 8 3 2 3; }
    </style>
    
    <text x="20" y="30" class="title">Representação em Projeção Ortogonal (3 Vistas)</text>
    
    <!-- Vista Frontal -->
    <g transform="translate(60, 60)">
        <rect x="0" y="0" width="120" height="80" class="box"/>
        <line x1="0" y1="40" x2="120" y2="40" class="line-hidden"/>
        <line x1="60" y1="-10" x2="60" y2="90" class="line-center"/>
        <text x="60" y="105" text-anchor="middle" class="view-title">Vista Frontal</text>
    </g>

    <!-- Vista Superior (abaixo da frontal) -->
    <g transform="translate(60, 180)">
        <rect x="0" y="0" width="120" height="60" class="box"/>
        <circle cx="60" cy="30" r="18" fill="none" stroke="#38bdf8" stroke-width="2"/>
        <line x1="60" y1="-10" x2="60" y2="70" class="line-center"/>
        <text x="60" y="85" text-anchor="middle" class="view-title">Vista Superior</text>
    </g>

    <!-- Vista Lateral Esquerda (à direita da frontal) -->
    <g transform="translate(240, 60)">
        <rect x="0" y="0" width="70" height="80" class="box"/>
        <line x1="35" y1="-10" x2="35" y2="90" class="line-center"/>
        <text x="35" y="105" text-anchor="middle" class="view-title">Vista Lat. Esq.</text>
    </g>

    <!-- Legenda explicativa -->
    <g transform="translate(360, 70)">
        <rect x="0" y="0" width="210" height="150" fill="#1e293b" rx="8" stroke="#334155"/>
        <text x="15" y="25" class="title" style="font-size:14px;">Elementos do Desenho:</text>
        <line x1="15" y1="50" x2="50" y2="50" stroke="#38bdf8" stroke-width="2"/>
        <text x="60" y="54" class="label">Aresta Visível</text>
        
        <line x1="15" y1="80" x2="50" y2="80" class="line-hidden"/>
        <text x="60" y="84" class="label">Aresta Oculta</text>
        
        <line x1="15" y1="110" x2="50" y2="110" class="line-center"/>
        <text x="60" y="114" class="label">Linha de Centro</text>
    </g>
</svg>
