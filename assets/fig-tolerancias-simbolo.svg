<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 250" width="100%" height="250" style="background:#0f172a; border-radius:12px; font-family:sans-serif;">
    <style>
        .title { fill: #f8fafc; font-size: 16px; font-weight: bold; }
        .label { fill: #cbd5e1; font-size: 13px; }
        .sub { fill: #94a3b8; font-size: 11px; }
        .box { fill: #1e293b; stroke: #38bdf8; stroke-width: 2; }
        .symbol { fill: #fbbf24; font-size: 20px; font-weight: bold; }
    </style>
    
    <text x="20" y="30" class="title">Simbologia de Tolerâncias e Rugosidade (ABNT / ISO)</text>

    <!-- Quadro de Controle de Tolerância Geométrica -->
    <g transform="translate(30, 60)">
        <text x="0" y="-10" class="label" style="font-weight:bold;">Quadro de Tolerância Geométrica:</text>
        <rect x="0" y="0" width="280" height="50" class="box" rx="4"/>
        <line x1="60" y1="0" x2="60" y2="50" stroke="#38bdf8" stroke-width="2"/>
        <line x1="180" y1="0" x2="180" y2="50" stroke="#38bdf8" stroke-width="2"/>
        
        <!-- Símbolo Paralelismo -->
        <text x="30" y="33" text-anchor="middle" class="symbol">//</text>
        <!-- Valor da Tolerância -->
        <text x="120" y="32" text-anchor="middle" fill="#f8fafc" font-weight="bold" font-size="16px">∅ 0,02</text>
        <!-- Elemento de Referência -->
        <text x="230" y="32" text-anchor="middle" fill="#4ade80" font-weight="bold" font-size="18px">A</text>

        <text x="30" y="70" text-anchor="middle" class="sub">Características</text>
        <text x="120" y="70" text-anchor="middle" class="sub">Valor (mm)</text>
        <text x="230" y="70" text-anchor="middle" class="sub">Datums / Ref.</text>
    </g>

    <!-- Símbolo de Rugosidade (Acabamento Superficial) -->
    <g transform="translate(360, 60)">
        <text x="0" y="-10" class="label" style="font-weight:bold;">Símbolo de Rugosidade Superficial:</text>
        
        <!-- Triângulo de rugosidade -->
        <polyline points="20,50 50,10 90,50" fill="none" stroke="#fbbf24" stroke-width="2.5"/>
        <line x1="50" y1="10" x2="120" y2="10" stroke="#fbbf24" stroke-width="2.5"/>
        
        <text x="70" y="0" fill="#38bdf8" font-size="14px" font-weight="bold">Ra 1,6 μm</text>
        <text x="130" y="15" fill="#cbd5e1" font-size="12px">N7 (Usinado)</text>

        <text x="0" y="80" class="sub">Ra: Desvio médio aritmético (microns)</text>
        <text x="0" y="98" class="sub">Classes de Rugosidade: N1 (0,025) a N12 (50 μm)</text>
    </g>
</svg>
